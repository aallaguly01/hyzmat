name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # интеграционные тесты API поднимают Postgres через testcontainers (Docker есть на раннере)
      - run: pnpm test
      - name: Build web + size limit
        run: pnpm --filter @hyzmat/web build && pnpm --filter @hyzmat/web size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - run: pnpm --filter @hyzmat/web exec playwright install --with-deps chromium
      - run: pnpm --filter @hyzmat/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
      - if: always()
        run: docker compose -f docker-compose.e2e.yml logs api && docker compose -f docker-compose.e2e.yml down -v
