# Локальный/CI стенд для E2E: мок Telegram во фронте, dev-токен бота, без TLS.
# docker compose -f docker-compose.e2e.yml up -d --build  →  http://localhost:8080
name: hyzmat-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hyzmat
      POSTGRES_USER: hyzmat
      POSTGRES_PASSWORD: hyzmat
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hyzmat -d hyzmat']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://hyzmat:hyzmat@postgres:5432/hyzmat
      BOT_TOKEN: '123456:DEV-TOKEN'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_MOCK_TELEGRAM: 'true'
        VITE_DEV_BOT_TOKEN: '123456:DEV-TOKEN'
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
